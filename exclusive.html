<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFF Lab | Eksklusiiv</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: white; overflow-x: hidden; }
        .text-gradient { background: linear-gradient(to right, #fff 30%, #64748b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .contact-overlay {
            position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); padding: 16px;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .contact-overlay.open { opacity: 1; pointer-events: all; }
        .contact-box {
            width: 100%; max-width: 720px; background: #111; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px; padding: 54px; position: relative;
            transform: translateY(20px) scale(0.97);
            transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.35s ease;
            opacity: 0;
        }
        .contact-overlay.open .contact-box { transform: translateY(0) scale(1); opacity: 1; }
        .contact-input {
            width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 14px 16px; color: #fff; font-size: 13px; font-family: inherit;
            outline: none; transition: border-color 0.2s; box-sizing: border-box;
        }
        .contact-input:focus { border-color: rgba(59,130,246,0.6); }
        .contact-input::placeholder { color: #52525b; }
        textarea.contact-input { resize: vertical; min-height: 180px; }
    </style>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="antialiased">

    <div class="pt-[73px] md:pt-[88px]">
        <section class="min-h-[80vh] flex items-center justify-center py-20 px-6 relative overflow-hidden">
            <div class="absolute inset-0 pointer-events-none">
                <div class="absolute top-1/2 left-1/2 w-[700px] h-[500px] bg-blue-600/8 blur-[140px] rounded-full" style="transform:translate(-50%,-50%)"></div>
            </div>
            <div class="relative z-10 max-w-3xl w-full text-center">
                <h1 class="text-gradient text-[3.5rem] sm:text-[5.5rem] md:text-[7.5rem] font-extrabold tracking-tighter leading-none uppercase mb-4" style="display:inline-block" data-key="excl-title">Eksklusiiv</h1>
                <p class="text-zinc-500 uppercase text-[10px] md:text-[11px] tracking-[0.4em] font-bold mb-10" data-key="excl-subtitle">Premium · Custom</p>
                <p class="text-zinc-400 text-base md:text-lg leading-relaxed max-w-xl mx-auto mb-12" data-key="excl-desc">
                    Eksklusiivne koostöö, eritellimus või äripartnerlus — kirjutage meile ja räägime lähemalt.
                </p>
                <button onclick="openContact()" class="px-10 py-4 rounded-full text-sm font-black uppercase tracking-widest text-white transition-all" style="background:#2563eb;box-shadow:0 8px 32px rgba(37,99,235,0.3);border:none;cursor:pointer;font-family:inherit" onmouseover="this.style.background='#3b82f6'" onmouseout="this.style.background='#2563eb'" data-key="excl-btn">Võta ühendust</button>
            </div>
        </section>
    </div>

    <!-- Contact Modal -->
    <div id="contact-overlay" class="contact-overlay" onclick="contactBackdrop(event)">
        <div class="contact-box">
            <button onclick="closeContact()" style="position:absolute;top:20px;right:20px;background:none;border:none;color:#52525b;cursor:pointer;font-size:24px;line-height:1;padding:4px">×</button>
            <p style="font-size:10px;font-weight:900;letter-spacing:0.2em;text-transform:uppercase;color:#2563eb;margin:0 0 8px">SFF Lab</p>
            <h2 style="font-size:28px;font-weight:900;color:#fff;margin:0 0 32px" data-key="excl-modal-title">Kirjuta meile</h2>
            <div style="display:flex;flex-direction:column;gap:16px">
                <input id="c-email" class="contact-input" type="email" placeholder="E-post *" data-ph="excl-ph-email" autocomplete="email">
                <input id="c-phone" class="contact-input" type="tel"   placeholder="Telefon *" data-ph="excl-ph-phone" autocomplete="tel">
                <textarea id="c-msg" class="contact-input" rows="5" placeholder="Teie sõnum..." data-ph="excl-ph-msg"></textarea>
            </div>
            <div id="c-error" style="display:none;margin-top:12px;color:#f87171;font-size:12px;font-weight:700"></div>
            <div id="c-success" style="display:none;margin-top:12px;color:#4ade80;font-size:12px;font-weight:700;line-height:1.5"></div>
            <button onclick="submitContact()" id="c-submit" class="w-full py-4 rounded-2xl text-xs font-black uppercase tracking-widest transition" style="background:#2563eb;color:#fff;border:none;cursor:pointer;margin-top:20px;font-family:inherit" data-key="excl-submit">Saada</button>
        </div>
    </div>

    <script>
        window.pageTranslations = {
            et: {
                'page-title':       'SFF Lab | Eksklusiiv',
                'excl-title':       'Eksklusiiv',
                'excl-subtitle':    'Premium · Custom',
                'excl-desc':        'Eksklusiivne koostöö, eritellimus või äripartnerlus — kirjutage meile ja räägime lähemalt.',
                'excl-btn':         'Võta ühendust',
                'excl-modal-title': 'Kirjuta meile',
                'excl-ph-email':    'E-post *',
                'excl-ph-phone':    'Telefon *',
                'excl-ph-msg':      'Teie sõnum...',
                'excl-submit':      'Saada'
            },
            ru: {
                'page-title':       'SFF Lab | Эксклюзив',
                'excl-title':       'Эксклюзив',
                'excl-subtitle':    'Премиум · Кастом',
                'excl-desc':        'Эксклюзивное сотрудничество, индивидуальный заказ или бизнес-партнёрство — напишите нам, и мы обсудим детали.',
                'excl-btn':         'Связаться',
                'excl-modal-title': 'Написать нам',
                'excl-ph-email':    'Электронная почта *',
                'excl-ph-phone':    'Телефон *',
                'excl-ph-msg':      'Ваше сообщение...',
                'excl-submit':      'Отправить'
            },
            en: {
                'page-title':       'SFF Lab | Exclusive',
                'excl-title':       'Exclusive',
                'excl-subtitle':    'Premium · Custom',
                'excl-desc':        'Exclusive collaboration, custom order or business partnership — write to us and let\'s talk details.',
                'excl-btn':         'Contact us',
                'excl-modal-title': 'Get in touch',
                'excl-ph-email':    'Email *',
                'excl-ph-phone':    'Phone *',
                'excl-ph-msg':      'Your message...',
                'excl-submit':      'Send'
            }
        };

        function updatePlaceholders(lang) {
            var tr = window.pageTranslations[lang] || window.pageTranslations.et;
            document.querySelectorAll('[data-ph]').forEach(function(el) {
                var v = tr[el.getAttribute('data-ph')];
                if (v) el.placeholder = v;
            });
        }

        function openContact() {
            document.getElementById('contact-overlay').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeContact() {
            document.getElementById('contact-overlay').classList.remove('open');
            document.body.style.overflow = '';
        }

        function contactBackdrop(e) {
            if (e.target === document.getElementById('contact-overlay')) closeContact();
        }

        async function submitContact() {
            var btn   = document.getElementById('c-submit');
            var errEl = document.getElementById('c-error');
            var sucEl = document.getElementById('c-success');
            var email = document.getElementById('c-email').value.trim();
            var phone = document.getElementById('c-phone').value.trim();
            var msg   = document.getElementById('c-msg').value.trim();
            var lang  = localStorage.getItem('selectedLanguage') || 'et';

            errEl.style.display = 'none';
            sucEl.style.display = 'none';

            if (!email || !phone || !msg) {
                var missing = { et: 'Palun täitke kõik väljad.', ru: 'Пожалуйста, заполните все поля.', en: 'Please fill in all fields.' };
                errEl.textContent = missing[lang] || missing.et;
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.style.opacity = '0.6';

            try {
                var res  = await fetch('/api/contact', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ email: email, phone: phone, message: msg, lang: lang })
                });
                var data = await res.json();

                if (!res.ok) {
                    var sendErr = { et: 'Viga saatmisel. Proovige uuesti.', ru: 'Ошибка отправки. Попробуйте снова.', en: 'Send error. Please try again.' };
                    errEl.textContent   = data.error || sendErr[lang] || sendErr.et;
                    errEl.style.display = 'block';
                    btn.disabled = false;
                    btn.style.opacity = '';
                    return;
                }

                var successMsg = {
                    et: 'Saadetud! Võtame teiega ühendust 2 tööpäeva jooksul.',
                    ru: 'Отправлено! Свяжемся с вами в течение 2 рабочих дней.',
                    en: 'Sent! We\'ll get back to you within 2 business days.'
                };
                sucEl.textContent   = successMsg[lang] || successMsg.et;
                sucEl.style.display = 'block';
                btn.style.display   = 'none';
                document.getElementById('c-email').value = '';
                document.getElementById('c-phone').value = '';
                document.getElementById('c-msg').value   = '';

            } catch (err) {
                var connErr = { et: 'Ühenduse viga. Proovige uuesti.', ru: 'Ошибка соединения. Попробуйте снова.', en: 'Connection error. Please try again.' };
                errEl.textContent   = connErr[lang] || connErr.et;
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.style.opacity = '';
            }
        }

        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeContact(); });

        window.addEventListener('load', function() {
            var lang = localStorage.getItem('selectedLanguage') || 'et';
            updatePlaceholders(lang);
            if (window.setLanguage) {
                var _orig = window.setLanguage;
                window.setLanguage = function(l) { _orig(l); updatePlaceholders(l); };
            }
        });
    </script>
    <script src="nav.js"></script>
</body>
</html>
